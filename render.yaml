services:
  - type: web
    name: lifepulse-blood-donor-system
    env: node
    plan: free
    buildCommand: "npm install && npm run build --prefix client && npm install --prefix server"
    startCommand: "npm run start --prefix server"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        value: admin123@gmail.com
      - key: ADMIN_PASSWORD
        value: admin123
